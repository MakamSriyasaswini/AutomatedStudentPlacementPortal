apiVersion: apps/v1
kind: Deployment
metadata:
  name: Automated-Student-placement-portal-deployment
  labels:
    app: Automated-Student-placement-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: Automated-Student-placement-portal
  template:
    metadata:
      labels:
        app: Automated-Student-placement-portal
    spec:
      containers:
      - name: Automated-Student-placement-portal
        image: makamsriya/Automated-Student-placement-portal:latest
        ports:
        - containerPort: 80
        imagePullPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: Automated-Student-placement-portal-service
spec:
  type: NodePort
  selector:
    app: Automated-Student-placement-portal
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30013
