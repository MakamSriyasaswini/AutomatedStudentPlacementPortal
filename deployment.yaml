pipeline {
    agent any

    environment {
        DOCKER_IMAGE = "makamsriya/automated-student-placement-portal:latest"
    }

    stages {
        stage('Clone Code') {
            steps {
                git branch: 'main',
                    url: 'https://github.com/MakamSriyasaswini/AutomatedStudentPlacementPortal.git'
            }
        }

        stage('Build Docker Image') {
            steps {
                bat 'docker build -t %DOCKER_IMAGE% .'
            }
        }

        stage('Push Image') {
            steps {
                withCredentials([
                    usernamePassword(
                        credentialsId: 'dockerhub',
                        usernameVariable: 'USER',
                        passwordVariable: 'PASS'
                    )
                ]) {
                    bat '''
                        @echo off
                        echo %PASS%| docker login -u %USER% --password-stdin
                        if errorlevel 1 exit /b 1
                        docker push %DOCKER_IMAGE%
                        if errorlevel 1 exit /b 1
                        docker logout
                    '''
                }
            }
        }

        stage('Deploy to Kubernetes') {
            steps {
                withCredentials([
                    file(
                        credentialsId: 'kuberconfig',
                        variable: 'KUBECONFIG_FILE'
                    )
                ]) {
                    bat '''
                        set "KUBECONFIG=%KUBECONFIG_FILE%"
                        kubectl apply -f deployment.yaml
                        if errorlevel 1 exit /b 1
                    '''
                }
            }
        }

        stage('Verify Deployment') {
            steps {
                withCredentials([
                    file(
                        credentialsId: 'kuberconfig',
                        variable: 'KUBECONFIG_FILE'
                    )
                ]) {
                    bat '''
                        set "KUBECONFIG=%KUBECONFIG_FILE%"
                        kubectl rollout status deployment/placement-portal --timeout=120s
                        if errorlevel 1 exit /b 1

                        kubectl get pods
                        kubectl get service
                    '''
                }
            }
        }
    }

    post {
        failure {
            withCredentials([
                file(
                    credentialsId: 'kuberconfig',
                    variable: 'KUBECONFIG_FILE'
                )
            ]) {
                bat '''
                    set "KUBECONFIG=%KUBECONFIG_FILE%"
                    kubectl rollout undo deployment/placement-portal
                    kubectl rollout status deployment/placement-portal --timeout=120s
                '''
            }
        }
    }
}

