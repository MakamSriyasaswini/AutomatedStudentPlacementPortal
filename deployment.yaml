apiVersion: apps/v1
kind: Deployment
metadata:
  name: AutomatedStudentplacementportal-deployment
  labels:
    app: AutomatedStudentplacementportal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: AutomatedStudentplacementportal
  template:
    metadata:
      labels:
        app: AutomatedStudentplacementportal
    spec:
      containers:
      - name: AutomatedStudentplacementportal
        image: makamsriya/AutomatedStudentplacementportal:latest
        ports:
        - containerPort: 80
        imagePullPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: AutomatedStudentplacementportal-service
spec:
  type: NodePort
  selector:
    app: AutomatedStudentplacementportal
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30013
